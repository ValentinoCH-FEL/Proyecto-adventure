<!-- Contenedor principal para centrar el formulario -->
<div class="login-container">
  <div class="login-card">
    <div class="logo-area">
      <!-- Reemplaza con tu logo real de Adventure Bus -->
      <img src="https://placehold.co/100x60/0a3d62/ffffff?text=BUS+LOGO" alt="Adventure Bus Logo" class="logo">
    </div>

    <h2 class="title">Acceso Administrador</h2>
    
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      
      <!-- Campo de Usuario -->
      <div class="form-group">
        <label for="username">Usuario</label>
        <input 
          id="username" 
          type="text" 
          formControlName="username" 
          placeholder="Nombre de usuario"
          class="form-input"
        >
        <!-- Mensajes de validación -->
        <div *ngIf="f['username'].invalid && (f['username'].dirty || f['username'].touched)" class="error-message">
          <div *ngIf="f['username'].errors?.['required']">El usuario es obligatorio.</div>
          <div *ngIf="f['username'].errors?.['minlength']">Mínimo 3 caracteres.</div>
        </div>
      </div>

      <!-- Campo de Contraseña -->
      <div class="form-group">
        <label for="password">Contraseña</label>
        <input 
          id="password" 
          type="password" 
          formControlName="password" 
          placeholder="Contraseña"
          class="form-input"
        >
        <!-- Mensajes de validación -->
        <div *ngIf="f['password'].invalid && (f['password'].dirty || f['password'].touched)" class="error-message">
          <div *ngIf="f['password'].errors?.['required']">La contraseña es obligatoria.</div>
          <div *ngIf="f['password'].errors?.['minlength']">Mínimo 4 caracteres.</div>
        </div>
      </div>

      <!-- Mensaje de Error de la API -->
      <div *ngIf="errorMessage" class="api-error">
        {{ errorMessage }}
      </div>

      <!-- Botón de Ingreso -->
      <button type="submit" [disabled]="loginForm.invalid || isLoading" class="btn-primary">
        {{ isLoading ? 'Ingresando...' : 'Ingresar' }}
      </button>
    </form>
  </div>
</div>
