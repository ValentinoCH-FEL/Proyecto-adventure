<div class="login-page">
  <div class="login-card">
    
    <div class="card-header">
      <div class="icon-brand">
        🔐
      </div>
      <h1 class="title">Acceso Admin</h1>
      <p class="subtitle">Bienvenido de nuevo. Ingresa tus credenciales.</p>
    </div>

    <form (ngSubmit)="login()" autocomplete="off">
      
      <div class="form-group">
        <label for="username">Usuario</label>
        <div class="input-wrapper">
          <span class="input-icon">👤</span>
          <input 
            type="text" 
            id="username" 
            [(ngModel)]="credentials.username" 
            name="username" 
            class="form-control"
            placeholder="Ej. admin_user" 
            autocomplete="username"
            required>
        </div>
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <div class="input-wrapper">
          <span class="input-icon">🔑</span>
          <input 
            type="password" 
            id="password" 
            [(ngModel)]="credentials.password" 
            name="password" 
            class="form-control"
            placeholder="••••••••" 
            autocomplete="current-password"
            required>
        </div>
      </div>
      
      <div class="alert-box error" *ngIf="error">
        <span class="icon">⚠️</span>
        <span>{{ error }}</span>
      </div>

      <button type="submit" class="btn-primary" [disabled]="loading">
        <span *ngIf="!loading">Iniciar Sesión</span>
        <span *ngIf="loading" class="loading-state">
          <span class="spinner"></span> Verificando...
        </span>
      </button>

    </form>
    
    <div class="card-footer">
      <a class="btn-back" [routerLink]="['/']"> 
        ← Regresar al inicio
      </a>
    </div>

  </div>
</div>
