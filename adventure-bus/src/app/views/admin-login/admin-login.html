<div class="login-container">
  <div class="login-card">
    <h1 class="title">Acceso de Administrador</h1>
    <p class="subtitle">Ingresa tus credenciales para acceder al panel de gestión.</p>

    <form (ngSubmit)="login()">
      <div class="form-group">
        <label for="username">Usuario</label>
        <input type="text" id="username" [(ngModel)]="credentials.username" name="username" placeholder="Ingresa tu usuario" required>
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" [(ngModel)]="credentials.password" name="password" placeholder="••••••••" required>
      </div>
      
      <div class="error-box" *ngIf="error">
        {{ error }}
      </div>

      <button type="submit" class="btn-login" [disabled]="loading">
        <span *ngIf="!loading">Ingresar</span>
        <span *ngIf="loading">Verificando... 🔒</span>
      </button>
    </form>
    
    <a class="btn-back" [routerLink]="['/']"> 
    ← Volver al inicio
</a>
  </div>
</div>
