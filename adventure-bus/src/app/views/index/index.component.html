<header class="header">
  <!-- NUEVO: Wrapper para centrar y limitar el ancho de la navegación -->
  <div class="header-content-wrapper">
    <nav class="navbar">
      <div class="logo">Adventure</div>
      <ul class="menu">
        <li>
          <a routerLink="/autogestion">Autogestión</a>
        </li>
        <li>
          <a routerLink="/contacto">Contacto</a>
        </li>
        <li class="language-selector"> <!-- Clase para estilizar el selector de idioma -->
          <label for="language-select">Idioma:</label>
          <select id="language-select" (change)="cambiarIdioma($event)">
            <option value="es">🇪🇸 ES</option>
            <option value="en">🇬🇧 EN</option>
            <option value="pt">🇧🇷 PT</option>
          </select>
        </li>
        <li>
          <a routerLink="/admin-login" class="btn-admin">Admin</a> <!-- Clase de botón para el enlace Admin -->
        </li>
      </ul>
    </nav>
  </div>
  

  <!-- BUSCADOR: Simplificación de etiquetas y adición de clases de layout -->
  <div class="buscador">
    <form (ngSubmit)="buscarViaje()" class="form-busqueda" aria-label="Formulario de búsqueda de viajes">
      
      <!-- Se eliminaron los <label> individuales del buscador para un diseño más limpio, usando placeholder -->
      <div class="campo input-origen"> 
        <input type="text" id="origen" name="origen" placeholder="Buscar Origen" [(ngModel)]="busqueda.origen" required>
      </div>

      <div class="icono">⇄</div>

      <div class="campo input-destino">
        <input type="text" id="destino" name="destino" placeholder="Buscar Destino" [(ngModel)]="busqueda.destino" required>
      </div>

      <div class="campo fecha-selector"> <!-- Contenedor para botones y fecha -->
        <!-- No se necesita un <label> aquí si ya tenemos los botones de contexto -->
        <div class="opciones-fecha">
          <button type="button" (click)="seleccionarHoy()">Hoy</button>
          <button type="button" (click)="seleccionarManana()">Mañana</button>
          <!-- El input de fecha usa ngModel y se conecta a la propiedad busqueda.fecha -->
          <input type="date" name="fecha" [(ngModel)]="busqueda.fecha" required>
        </div>
      </div>

      <button type="submit" class="btn-buscar">
        🔍 Buscar
      </button>
    </form>
  </div>
</header>

<main class="main-content"> <!-- NUEVO: Wrapper principal para centrar el contenido de las secciones -->
  <section class="carrusel">
    <!-- INICIO DE CAMBIOS PARA EL CARRUSEL FUNCIONAL -->
    
    <!-- CONTROLES DE NAVEGACIÓN (Flechas) -->
    <!-- Se conectan a las funciones prevSlide() y nextSlide() del componente TS -->
    <button class="prev" (click)="prevSlide()">&#10094;</button>
    <button class="next" (click)="nextSlide()">&#10095;</button>
    
    <!-- CONTENEDOR DE SLIDES -->
    <!-- [style.transform] es CRÍTICO: mueve el contenedor horizontalmente basándose en currentSlide -->
    <div class="slides" [style.transform]="'translateX(-' + currentSlide * 100 + '%)'">
      <!-- La estructura de los slides (imágenes) permanece igual -->
      <div class="slide" *ngFor="let slide of slides; let i = index">
        <img [src]="slide.url" [alt]="slide.alt">
      </div>
    </div>
    
    <!-- INDICADORES (Puntos inferiores para navegar) -->
    <div class="indicators">
      <!-- Itera sobre los slides y crea un punto por cada uno -->
      <span 
        *ngFor="let slide of slides; let i = index" 
        [class.active]="i === currentSlide"
        (click)="goToSlide(i)">
      </span>
    </div>

    <!-- FIN DE CAMBIOS PARA EL CARRUSEL FUNCIONAL -->
  </section>

  <section class="destinos">
    <h2>Destinos destacados</h2>
    <div class="grid-destinos">
      <article class="card destination-card" *ngFor="let destino of destinosDestacados"> <!-- Nueva clase de tarjeta -->
        <!-- La imagen se enlaza al modelo TS -->
        <img [src]="destino.imagenUrl" [alt]="destino.ruta">
        <div class="info">
          <h3>{{ destino.ruta }}</h3> <!-- Usara h3 para el título dentro de la tarjeta -->
          <button (click)="comprarDestacado(destino)" class="btn-primary">Comprar</button> <!-- Clase para botón primario -->
        </div>
      </article>
    </div>
  </section>

  <section class="servicios">
    <h2>Nuestros servicios</h2>
    <div class="grid-servicios">
      <article class="card service-card" *ngFor="let servicio of servicios"> <!-- Nueva clase de tarjeta de servicio -->
        <!-- La imagen de servicio se enlaza al modelo TS -->
        <img [src]="servicio.imagenUrl" [alt]="servicio.descripcion">
        <div class="info">
          <p>{{ servicio.descripcion }}</p>
        </div>
      </article>
    </div>
  </section>
</main>

<footer>
  <p>&copy; 2025 Adventure. Todos los derechos reservados.</p>
</footer>
