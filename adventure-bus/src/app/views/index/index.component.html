<header class="header">
  <nav class="navbar">
    <div class="logo">Adventure</div>
    <ul class="menu">
      <li>
        <a routerLink="/autogestion" class="btn-menu">Autogestión</a>
      </li>
      <li>
        <a routerLink="/contacto" class="btn-menu">Contacto</a>
      </li>
      <li>
        <select (change)="cambiarIdioma($event)">
          <option value="es">🇪🇸 ES</option>
          <option value="en">🇬🇧 EN</option>
          <option value="pt">🇧🇷 PT</option>
        </select>
      </li>
      <li>
        <a routerLink="/admin-login" class="btn-menu">Admin</a>
      </li>
    </ul>
  </nav>

  <div class="buscador">
    <form (ngSubmit)="buscarViaje()" class="form-busqueda">
      <div class="campo">
        <label>Origen</label>
        <input type="text" name="origen" placeholder="Buscar Origen" [(ngModel)]="busqueda.origen" required>
      </div>

      <div class="icono">⇄</div>

      <div class="campo">
        <label>Destino</label>
        <input type="text" name="destino" placeholder="Buscar Destino" [(ngModel)]="busqueda.destino" required>
      </div>

      <div class="campo fecha">
        <label>¿Cuándo viajas?</label>
        <div class="opciones-fecha">
          <button type="button" (click)="seleccionarHoy()">Hoy</button>
          <button type="button" (click)="seleccionarManana()">Mañana</button>
          <input type="date" name="fecha" [(ngModel)]="busqueda.fecha" required>
        </div>
      </div>

      <button type="submit" class="btn-buscar">
        🔍 Buscar
      </button>
    </form>
  </div>
</header>

<main>
  <section class="carrusel">
    <input type="radio" name="radio-btn" id="radio1" checked>
    <input type="radio" name="radio-btn" id="radio2">
    <input type="radio" name="radio-btn" id="radio3">

    <div class="slides">
      <div class="slide" *ngFor="let slide of slides; let i = index">
        <img [src]="slide.url" [alt]="slide.alt">
      </div>
    </div> </section>

  <section class="destinos">
    <h2>Destinos destacados</h2>
    <div class="grid-destinos">
      <div class="card" *ngFor="let destino of destinosDestacados">
        <img [src]="destino.imagenUrl" [alt]="destino.ruta">
        <div class="info">
          <p>{{ destino.ruta }}</p>
          <button (click)="comprarDestacado(destino)">Comprar</button>
        </div>
      </div>
    </div>
  </section>

  <section class="servicios">
    <h2>Nuestros servicios</h2>
    <div class="grid-servicios">
      <div class="card" *ngFor="let servicio of servicios">
        <img [src]="servicio.imagenUrl" [alt]="servicio.descripcion">
        <div class="info">
          <p>{{ servicio.descripcion }}</p>
        </div>
      </div>
    </div>
  </section>
</main>

<footer>
  <p>&copy; 2025 Adventure. Todos los derechos reservados.</p>
</footer>
